name: Atualizar preços pelos anúncios da Liga

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/ligapokemon-offers.json
      - data/ligapokemon-browser-progress.json
      - data/ligapokemon-browser-checkpoints/**
      - .github/workflows/update-prices.yml
      - scripts/import-liga-browser-capture.mjs
      - scripts/prepare-liga-browser-checkpoints.mjs
      - scripts/providers/ligaPokemon.mjs

permissions:
  contents: write

concurrency:
  group: pokemon-price-database-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gerar os IDs de cartas e idiomas do aplicativo
        run: npm run catalog
      - name: Importar edições e numeração observadas na Liga
        run: npm run liga:import-versions -- data/ligapokemon-edition-index.json
      - name: Reconstruir catálogo com versões da Liga
        run: npm run catalog
      - name: Preparar preços dos checkpoints acumulados
        run: node scripts/prepare-liga-browser-checkpoints.mjs
      - name: Processar somente o snapshot de anúncios da Liga
        run: npm run liga:import-snapshot
      - name: Validar proveniência, cobertura e preços
        run: npm run validate
      - name: Publicar dados validados
        run: |
          git config user.name "pokemon-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/ cache/shards/ history/ data/ligapokemon-offers.json
          git diff --cached --quiet || git commit -m "Atualizar preços Liga Pokémon $(date -u +%F)"
          git push

name: Atualizar tabela de preços
on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run update
      - run: npm run validate
      - name: Publicar arquivos atualizados
        run: |
          git config user.name "pokemon-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/prices-current.json output/unmatched-cards.json
          git diff --cached --quiet || git commit -m "Atualizar preços $(date -u +%F)"
          git push
